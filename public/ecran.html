<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Écran Blind Test</title><link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body><span id="net" class="net"></span>
<div class="tv">
  <div class="player">
    <div id="yt"></div>
    <div class="overlay on" id="start">
      <h1 style="font-size:2.5rem">📺 Écran du Blind Test</h1>
      <p class="muted">Clique pour activer le son et la vidéo</p>
      <button class="b-acc" id="startBtn" style="font-size:1.4rem">Activer l'écran</button>
    </div>
    <div class="overlay" id="answer">
      <div class="muted" style="font-size:2rem">🎤 C'est à</div>
      <div class="who" id="who"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="overlay" id="ended" style="justify-content:flex-start;padding:30px;overflow:auto"><div id="reveal" style="width:100%;max-width:800px"></div></div>
    <div class="overlay" id="novideo" style="background:transparent"><p class="muted" style="font-size:1.4rem">En attente de la vidéo du maître du jeu…</p></div>
  </div>
  <div class="side">
    <div class="card" style="text-align:center">
      <b>Scanne pour jouer</b>
      <div id="qr"></div>
      <div class="muted" style="font-size:.85rem;word-break:break-all" id="joinUrl"></div>
    </div>
    <div class="card"><div class="phase" id="phase"></div>
      <button id="freeze" class="full" style="margin-top:10px">⏸ Pause</button></div>
    <div class="card"><b>Joueurs</b><div id="players" style="margin-top:8px"></div></div>
  </div>
</div>
<script src="/common.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $ = id => document.getElementById(id);
const joinUrl = location.origin + '/joueur';
$('joinUrl').textContent = joinUrl;
try { new QRCode($('qr'), { text: joinUrl, width: 200, height: 200 }); } catch (e) {}

let yt = null, ytReady = false, activated = false, loadedNonce = null;
function onYouTubeIframeAPIReady() {
  yt = new YT.Player('yt', {
    width: '100%', height: '100%',
    playerVars: { rel: 0, modestbranding: 1, playsinline: 1, controls: 0, disablekb: 1 },
    events: { onReady: () => { ytReady = true; sync(); } },
  });
}
$('startBtn').onclick = () => {
  activated = true; $('start').classList.remove('on');
  BT.beep(660, .05); BT.keepAwake();
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch (e) {}
  sync();
};

$('freeze').onclick = () => BT.act({ type: 'freeze' });
document.addEventListener('keydown', e => { if (e.code === 'Space' && activated) { e.preventDefault(); BT.act({ type: 'freeze' }); } });

function sync() {
  const s = BT.state; if (!s || !ytReady || !activated) return;
  if (s.video && s.video.nonce !== loadedNonce) {
    loadedNonce = s.video.nonce;
    yt.cueVideoById({ videoId: s.video.id, startSeconds: s.video.start || 0 });
  }
  if (!s.video) return;
  const st = yt.getPlayerState ? yt.getPlayerState() : -1;
  if (s.playing && st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) yt.playVideo();
  if (!s.playing && st === YT.PlayerState.PLAYING) yt.pauseVideo();
}

const LABEL = { lobby: '⏸ En attente des joueurs', waiting: '🔒 Attente du prochain extrait', open: '🟢 Buzzers ouverts !', answering: '🎤 Réponse en cours', ended: '🏁 Partie terminée' };
BT.connect('screen', '', s => { sync(); render(); }, {
  buzz: () => { BT.beep(990, .35); },
  verdict: d => {
    if (d.ok) { BT.beep(1320, .15); setTimeout(() => BT.beep(1760, .25), 150); }
    else BT.beep(180, .5);
    const p = document.querySelector('.player'); p.classList.remove('flash-ok', 'flash-ko'); void p.offsetWidth;
    p.classList.add(d.ok ? 'flash-ok' : 'flash-ko');
  },
});

function render() {
  const s = BT.state; if (!s) return;
  $('phase').textContent = s.frozen ? '⏸ Pause — buzzers bloqués' : (LABEL[s.phase] || s.phase);
  $('freeze').textContent = s.frozen ? '▶️ Reprendre' : '⏸ Pause';
  $('freeze').className = 'full' + (s.frozen ? ' b-gold' : '');
  $('freeze').style.display = s.phase === 'ended' ? 'none' : '';
  const gnow = BT.gameNow(s);
  $('players').innerHTML = s.players.map(p => {
    const cd = Math.ceil((p.cooldownUntil - gnow) / 1000);
    return `<span class="pill ${p.connected ? '' : 'off'}">${BT.esc(p.name)}${cd > 0 && s.phase !== 'lobby' ? ` ⏳${cd}s` : ''}</span>`;
  }).join('') || '<span class="muted">Personne pour l\'instant</span>';
  const ans = s.phase === 'answering' && s.buzz;
  $('answer').classList.toggle('on', !!ans);
  if (ans) {
    $('who').textContent = s.buzz.name;
    $('count').textContent = s.frozen ? '⏸' : Math.max(0, Math.ceil((s.buzz.until - gnow) / 1000));
  }
  $('ended').classList.toggle('on', s.phase === 'ended');
  if (s.phase === 'ended') BT.renderReveal($('reveal'), s);
  $('novideo').classList.toggle('on', activated && !s.video);
}
let lastShown = -1;
setInterval(() => {
  render();
  const s = BT.state;
  if (s && s.phase === 'ended') {
    const n = Math.floor((BT.now() - s.revealStart) / s.revealStep) + 1;
    if (n !== lastShown && n >= 1 && n <= (s.ranking || []).length + 1) { lastShown = n; BT.beep(n > s.ranking.length ? 1320 : 520, .2); }
  } else lastShown = -1;
}, 200);
setInterval(sync, 1000);
</script></body></html>
